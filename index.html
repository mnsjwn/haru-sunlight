<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>일광 처방</title>
<!-- 아래 경로는 전부 상대경로다. GitHub Pages는 프로젝트를
     https://사용자이름.github.io/저장소이름/ 형태의 하위 경로로 서비스하므로,
     "/manifest.json"처럼 슬래시로 시작하는 절대경로를 쓰면 실제로는
     https://사용자이름.github.io/manifest.json 을 찾아 404가 난다.
     반드시 이 파일(index.html)과 같은 폴더 기준의 상대경로를 사용한다. -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D97706">
<meta name="color-scheme" content="light">
<!-- 홈 화면에 추가했을 때 주소창 없이 앱처럼 뜨게 하는 iOS 전용 태그.
     manifest.json의 display:"standalone"과 같은 역할을 안드로이드/iOS 각각에 대해 보강한다. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="일광 처방">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Figma 디자인 폰트: DM Serif Display(숫자·영문 디스플레이용) + Noto Sans KR(본문/한글).
     DM Serif Display는 한글 글리프가 없어 그대로 쓰면 한글이 깨지므로, 숫자·기호가
     중심인 요소(.num-display: 처방 분(分) 숫자, 온도, 타이머 카운트다운, 퍼센트 등)에만
     한정해 적용하고 한글이 섞인 모든 텍스트는 Noto Sans KR을 그대로 쓴다. -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================================================
     디자인 토큰 — Figma "일광 처방 홈 화면 디자인" 기준
     따뜻한 아이보리·앰버 팔레트. 기존 --primary(#D97706)는 그대로 유지하고,
     배경·보더·잉크 계열만 차가운 회색조에서 따뜻한 톤으로 옮겼다.
     ============================================================================================ */
  :root{
    --primary:#D97706;
    --primary-2:#F59E0B;
    --primary-deep:#B45B08;
    --primary-shadow:rgba(217,119,6,.28);
    --primary-tint:#FDEEDA;
    --primary-tint-2:#FFF6E7;

    --ink:#2B2013;
    --ink2:#4A3A26;
    --gray:#8A7A65;
    --gray2:#A79781;
    --gray3:#CBBFA9;
    --line:#F1E4D0;
    --bg:#FFF8ED;
    --card:#FFFFFF;

    --warn:#E0632E;
    --warn-bg:#FDECE4;
    --ok:#1FA971;
    --ok-bg:#E6F7EF;
    --danger:#D6304A;
    --danger-bg:#FCE8EB;
    --purple:#6B4FC9;
    --purple-bg:#F1EEFB;
    --todo:#A99575;
    --todo-bg:#F4ECDD;

    --r-lg:24px; --r-md:16px; --r-sm:12px;
    --shadow-card:0 1px 2px rgba(43,33,19,.05), 0 14px 30px rgba(43,33,19,.06);
    --shadow-btn:0 10px 22px var(--primary-shadow);
    --font-display:'DM Serif Display', Georgia, serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);
    color:var(--ink);
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:430px; min-height:100vh;
    background:var(--bg);
    display:flex; flex-direction:column;
    position:relative;
    padding-bottom:calc(86px + env(safe-area-inset-bottom));
  }
  .hide{display:none !important}
  button{font-family:inherit}
  button:focus-visible, .tab:focus-visible, .opt:focus-visible, .chip:focus-visible,
  .switch:focus-visible, select:focus-visible, input:focus-visible, .avatar-btn:focus-visible{
    outline:2.5px solid var(--primary-deep); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
  .num-display{ font-family:var(--font-display); font-weight:400; }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex; align-items:flex-start; gap:12px;
    padding:18px 20px 10px;
  }
  .topbar-left{flex:1; min-width:0}
  .topbar-loc{
    display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:800;
    color:var(--primary-deep); margin-bottom:4px;
  }
  .topbar-loc svg{width:13px;height:13px;flex:none}
  .topbar h1{font-size:22px;font-weight:900;letter-spacing:-.5px;color:var(--ink)}
  .topbar .sub{margin-top:2px;font-size:12px;font-weight:700;color:var(--gray)}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;flex:none;
    background:var(--primary-tint);color:var(--primary);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .avatar-btn svg{width:19px;height:19px}
  .logo{
    width:38px;height:38px;border-radius:12px;background:var(--primary);
    display:flex;align-items:center;justify-content:center;flex:none;
    box-shadow:0 8px 18px var(--primary-shadow);
  }
  .logo svg{width:21px;height:21px}

  section.screen{padding:8px 20px 20px; flex:1}

  /* ---------- generic card ---------- */
  .card{
    background:var(--card); border-radius:var(--r-lg); padding:20px;
    box-shadow:var(--shadow-card);
    margin-bottom:14px;
  }
  .card h3{font-size:13px;font-weight:900;color:var(--gray);letter-spacing:.03em;margin-bottom:10px}
  .card h3 .todo{margin-left:6px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;
  }
  .pill.blue{background:var(--primary-tint);color:var(--primary-deep)}
  .pill.ok{background:var(--ok-bg);color:var(--ok)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.danger{background:var(--danger-bg);color:var(--danger)}
  .pill.gray{background:#F1ECE1;color:var(--gray)}
  .pill.purple{background:var(--purple-bg);color:var(--purple)}

  .badge-todo{
    display:inline-flex;align-items:center;gap:4px;
    padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;
    color:var(--todo);background:var(--todo-bg);border:1px dashed #D8C7A8;
    letter-spacing:.02em;vertical-align:middle;
  }

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;min-height:52px;border-radius:16px;border:none;cursor:pointer;
    font-family:inherit;font-size:16px;font-weight:800;
    background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
    box-shadow:var(--shadow-btn);
  }
  .btn:active{transform:translateY(1px)}
  .btn.secondary{background:var(--primary-tint);color:var(--primary-deep);box-shadow:none}
  .btn.ghost{background:transparent;color:var(--gray);box-shadow:none;min-height:44px;font-size:14px;font-weight:700}
  .btn.sm{min-height:44px;font-size:13.5px;border-radius:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btn:disabled:active{transform:none}

  /* ---------- onboarding ---------- */
  #onboarding{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    display:flex;flex-direction:column;
    width:100%; max-width:430px; margin:0 auto;
  }
  .ob-head{padding:28px 24px 6px}
  .ob-step{font-size:12px;font-weight:900;color:var(--primary-deep);letter-spacing:.1em;margin-bottom:8px}
  .ob-title{font-size:23px;font-weight:900;line-height:1.4;letter-spacing:-.6px;color:var(--ink)}
  .ob-body{padding:18px 24px;flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;min-height:0}
  .ob-foot{padding:16px 24px calc(28px + env(safe-area-inset-bottom));flex:none}
  .opt{
    border:2px solid var(--line);border-radius:var(--r-md);padding:16px 16px;
    display:flex;align-items:center;gap:12px;cursor:pointer;background:#fff;
    min-height:44px;
  }
  .opt.on{border-color:var(--primary);background:var(--primary-tint)}
  .opt .radio{
    width:20px;height:20px;border-radius:50%;border:2px solid var(--gray3);flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .opt.on .radio{border-color:var(--primary)}
  .opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
  .opt .txt{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink)}
  .opt .txt b{display:block;font-size:14px;font-weight:900;margin-bottom:2px;color:var(--gray)}

  /* ---------- splash ---------- */
  #splash{
    position:fixed;inset:0;z-index:60;
    background:linear-gradient(160deg,var(--primary) 0%,var(--primary-2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    width:100%; max-width:430px; margin:0 auto;
  }
  #splash .mark{width:96px;height:96px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 16px 34px rgba(0,0,0,.16)}
  #splash .mark svg{width:52px;height:52px}
  #splash .wordmark{color:#fff;font-size:30px;font-weight:900;letter-spacing:-1px}
  #splash .tag{color:rgba(255,255,255,.82);font-size:12.5px;font-weight:700;letter-spacing:.04em;text-align:center;padding:0 30px}

  /* ---------- home: 오늘의 햇빛 처방 히어로 카드 ---------- */
  .hero-card{
    position:relative;
    background:linear-gradient(160deg,var(--primary-tint-2) 0%,var(--primary-tint) 60%,#FFE2B4 100%);
    border-radius:var(--r-lg);padding:20px 20px 22px;margin-bottom:14px;
    box-shadow:var(--shadow-card);
    border:1px solid #FBE3BC;
  }
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .hero-badge{
    display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;
    background:rgba(255,255,255,.72);color:var(--primary-deep);font-size:12px;font-weight:900;
    white-space:nowrap;min-width:0;
  }
  .hero-badge svg{width:13px;height:13px;flex:none}
  .hero-sun{width:34px;height:34px;flex:none;color:var(--primary)}
  .hero-sun svg{width:100%;height:100%}
  .weather-cache{font-size:10.5px;font-weight:700;color:var(--gray);opacity:.8;margin-top:6px;text-align:right}

  .fraction{
    display:flex;align-items:baseline;gap:8px;justify-content:center;padding:10px 0 2px;
  }
  .fraction .num{font-size:60px;font-weight:400;letter-spacing:-1px;color:var(--primary-deep);line-height:1}
  .fraction .unit{font-size:18px;font-weight:800;color:var(--ink2)}
  .why{text-align:center;font-size:13.5px;font-weight:800;color:var(--ink2);margin-bottom:2px;display:flex;align-items:center;justify-content:center;gap:6px}
  .why svg{width:14px;height:14px;flex:none;color:var(--primary-deep)}
  .why b{color:var(--primary-deep)}
  .why-sub{text-align:center;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:14px;line-height:1.6}
  .why-sub b{color:var(--ink2);font-weight:800}

  .hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
  .hero-stat{
    background:rgba(255,255,255,.72);border-radius:var(--r-sm);padding:9px 6px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .hero-stat .v{font-size:14.5px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:3px}
  .hero-stat .v svg{width:13px;height:13px;color:var(--primary-deep)}
  .hero-stat .l{font-size:10px;font-weight:700;color:var(--gray)}

  .hero-progress-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:6px}
  .hero-progress-track{height:8px;border-radius:999px;background:rgba(255,255,255,.65);overflow:hidden;margin-bottom:16px}
  .hero-progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--primary-2))}

  .breakdown-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 0;border-top:1px solid var(--line);
  }
  .breakdown-row:first-of-type{border-top:none}
  .breakdown-row .label{font-size:14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
  .breakdown-row .val{font-size:15px;font-weight:900;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--gray3);flex:none}
  .dot.hit{background:var(--primary)}
  .formula-note{font-size:11px;font-weight:600;color:var(--gray3);margin-top:10px;line-height:1.6}

  /* .chart-wrap은 24개의 시간대 컬럼(.chart-col)을 가로로 나열하는 행이다.
     각 컬럼은 flex:1로 균등폭을 갖지만, 기본값인 min-width:auto 때문에
     내용(숫자 텍스트)의 최소 폭보다 좁아지지 못해 좁은 화면에서 24칸 전체가
     화면 밖으로 넘치는 문제가 있었다 — min-width:0으로 강제로 줄어들게 한다. */
  .chart-wrap{margin-top:4px}
  .chart-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
  .chart{display:flex;align-items:flex-end;gap:3px;height:76px;width:100%}
  .chart .bar{flex:1;border-radius:5px 5px 2px 2px;background:var(--line);position:relative;min-height:4px}
  .chart .bar.open{box-shadow:inset 0 0 0 2px rgba(180,91,8,.55)}
  .chart .bar.now{outline:2px solid var(--ink);outline-offset:1px}
  /* 이전에는 ".chart .hr"/".chart .temp"로 선언되어 있었지만 실제 마크업에서
     .hr/.temp는 .chart의 형제(sibling)라 이 선택자가 전혀 매칭되지 않았다.
     그 결과 9px/8.5px 지정이 무시되고 body 기본값(16px)으로 렌더링되어
     24칸짜리 시간별 그래프가 필요 이상으로 넓어지는 원인이 되었다. */
  .hr{font-size:9px;color:var(--gray3);text-align:center;margin-top:4px;line-height:1.3}
  .temp{font-size:8.5px;color:var(--gray3);text-align:center;line-height:1.3}
  .chart-legend{display:flex;flex-wrap:wrap;gap:10px 14px;margin-top:10px}
  .chart-legend .li{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--gray)}
  .chart-legend .sw{width:9px;height:9px;border-radius:3px;flex:none}

  .windowlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .windowlist .wi{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--primary-tint-2);border:1px solid #F5DFB4;border-radius:14px;padding:12px 14px;
  }
  .windowlist .wi .t{font-size:14px;font-weight:900;color:var(--ink)}
  .windowlist .wi .m{font-size:12px;font-weight:700;color:var(--gray)}
  .windowlist .wi .lim{font-size:13px;font-weight:900;color:var(--primary-deep);flex:none}

  .gauge-wrap{display:flex;align-items:center;gap:16px}
  .gauge{width:64px;height:64px;border-radius:50%;flex:none;position:relative;
    background:conic-gradient(var(--primary) calc(var(--pct,0)*1%), var(--line) 0);
    display:flex;align-items:center;justify-content:center;}
  .gauge::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
  .gauge span{position:relative;font-size:14px;font-weight:900;color:var(--ink)}

  .banner{border-radius:var(--r-md);padding:16px;font-size:13px;font-weight:700;line-height:1.65}
  .banner.winter{background:#F1ECE3;color:var(--ink2)}
  .banner.heat{background:var(--warn-bg);color:#9C4A22}
  .banner.rain{background:var(--purple-bg);color:#4A3990}
  .banner.info{background:var(--primary-tint);color:var(--primary-deep)}
  .banner b{color:inherit}

  /* ---------- streak / tip 카드 (Figma: "4일 연속 달성!", "오늘의 햇빛 팁") ---------- */
  .streak-card{
    display:flex;align-items:center;gap:12px;background:var(--primary-tint-2);
    border:1px solid #F6E2BB;border-radius:var(--r-md);padding:14px 16px;margin-bottom:14px;
  }
  .streak-card .emoji{font-size:24px;flex:none}
  .streak-card .t{font-size:14px;font-weight:900;color:var(--ink)}
  .streak-card .s{font-size:12px;font-weight:600;color:var(--gray);margin-top:2px}
  .tip-card{
    display:flex;gap:12px;background:var(--primary-tint);border-radius:var(--r-md);
    padding:16px;margin-bottom:14px;
  }
  .tip-card .ic{width:20px;height:20px;flex:none;color:var(--primary-deep)}
  .tip-card .body h3{margin-bottom:6px}
  .tip-card .body p{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.65}

  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:100px;
    width:calc(100% - 40px);max-width:390px;z-index:80;
    background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;
    box-shadow:0 16px 32px rgba(0,0,0,.28);
  }

  /* ---------- timer ---------- */
  .timer-ring-wrap{display:flex;justify-content:center;padding:20px 0 4px}
  .timer-ring{position:relative;width:min(220px,58vw);height:min(220px,58vw)}
  .timer-ring svg{transform:rotate(-90deg);width:100%;height:100%}
  .timer-ring .center{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .timer-ring .time{font-family:var(--font-display);font-size:40px;font-weight:400;letter-spacing:0;font-variant-numeric:tabular-nums;color:var(--ink)}
  .timer-ring .lbl{font-size:12px;font-weight:800;color:var(--gray);margin-top:4px}
  .timer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .timer-stats .cell{text-align:center;padding:8px 4px;border-radius:var(--r-sm);background:var(--primary-tint-2)}
  .timer-stats .cell .v{font-size:14px;font-weight:900;color:var(--ink)}
  .timer-stats .cell .l{font-size:10px;font-weight:700;color:var(--gray);margin-top:2px}

  .toggle-row{display:flex;gap:8px}
  .chip{
    flex:1;text-align:center;padding:12px 6px;border-radius:14px;border:2px solid var(--line);
    font-size:12.5px;font-weight:800;color:var(--gray);cursor:pointer;background:#fff;
    min-height:44px;display:flex;align-items:center;justify-content:center;
  }
  .chip.on{border-color:var(--primary);background:var(--primary-tint);color:var(--primary-deep)}

  .switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.15s}
  .switch.on{background:var(--primary)}
  .switch.on::after{left:21px}
  @media (prefers-reduced-motion: reduce){ .switch::after{transition:none} }

  /* ---------- weekly ---------- */
  .week-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
  .week-summary .cell{text-align:center;padding:12px 4px;border-radius:var(--r-sm);background:var(--primary-tint-2)}
  .week-summary .cell .v{font-family:var(--font-display);font-size:20px;font-weight:400;color:var(--primary-deep)}
  .week-summary .cell .l{font-size:10.5px;font-weight:700;color:var(--gray);margin-top:2px}

<script>
/* ==========================================================================================
   일광 처방 — 프로토타입 v2
   기준 문서: 일광처방_개발명세.md (§ 번호로 주석 표기) + 시스템 아키텍처 다이어그램
   구조: 1층 API → 2층 엔진(순수함수) → 3층 기상·계절 판정 → 4층 화면
         (저장·플랫폼 레이어는 Store 모듈이 전 계층에 공용으로 제공)
   ========================================================================================== */

/* ==========================================================================================
   ⚙️ 배포 설정 — 여기 한 줄만 채우면 된다
   ------------------------------------------------------------------------------------------
   기상청 인증키는 이 파일(브라우저에 그대로 노출되는 코드) 안에 절대 두지 않는다.
   대신 /proxy 폴더의 Cloudflare Worker를 배포해서 인증키를 그 안에 시크릿으로 숨기고,
   이 앱은 그 워커의 주소만 호출한다. 워커를 배포한 뒤 아래에 그 주소를 채워 넣는다.
   (README.md "3. 기상청 API 프록시(Cloudflare Workers) 배포" 참고)
   ========================================================================================== */
const KMA_PROXY_BASE = ""; // 예: "https://hauri-haetbit-kma-proxy.내계정.workers.dev" (마지막 슬래시 없이)

/* ==========================================================================================
   §2 엔진 공식 — 상수 (통일 대상: 절대 임의 변경 금지)
   ========================================================================================== */
const MED = { I:150, II:250, III:300, IV:400, V:500, VI:600 };   // 최소홍반량(J/m²), 피부타입별
const K_VITAMIN = 0.4;          // 비타민D/홍반 비율 — 문헌범위 0.3~0.5 중 중앙값(잠정, §10 미확정)
const UVI_FACTOR = 1.5;         // UVI → 홍반조사량(W/m²) 환산계수, 고정
const FBSA = { short_short:0.40, short_long:0.25, long_long:0.10 };  // 옷차림별 노출 피부 면적 비율
const CLOTH_LABELS = ["반팔 + 반바지","반팔 + 긴바지","긴팔 + 긴바지 (얼굴·손만)"];
const CLOTH_KEYS = ["short_short","short_long","long_long"];
const SKIN_LABEL = { I:"타입 I", II:"타입 II", III:"타입 III", IV:"타입 IV", V:"타입 V", VI:"타입 VI" };

/* ==========================================================================================
   §3 열 안전 상한 — NOAA Heat Index
   ========================================================================================== */
function heatIndexC(tempC, rh){
  const T = tempC * 9/5 + 32; // ℃ → ℉
  if (T < 80) return tempC;   // 80℉ 미만은 체감온도 보정 의미가 없어 실측 기온 그대로 사용
  let HI = -42.379 + 2.04901523*T + 10.14333127*rh - 0.22475541*T*rh
    - 0.00683783*T*T - 0.05481717*rh*rh + 0.00122874*T*T*rh
    + 0.00085282*T*rh*rh - 0.00000199*T*T*rh*rh;
  if (rh < 13 && T >= 80 && T <= 112) HI -= ((13-rh)/4)*Math.sqrt((17-Math.abs(T-95))/17);
  if (rh > 85 && T >= 80 && T <= 87) HI += ((rh-85)/10)*((87-T)/5);
  return (HI - 32) * 5/9; // ℉ → ℃
}
/** §3 표 그대로: 체감온도 구간별 최대 노출(분) + 지시 문구 */
function heatCap(hiC){
  if (hiC < 31) return { max: Infinity, msg: null };
  if (hiC < 35) return { max: 20, msg: "물 마시고 나가세요" };
  if (hiC < 38) return { max: 10, msg: "모자 쓰고, 직사광은 짧게" };
  return { max: 0, msg: "노출 금지 — 다른 시간대로" };
}

/* ==========================================================================================
   §2 태양고도 — NOAA Solar Position Algorithm (SunCalc 알고리즘 기반)
   ========================================================================================== */
const RAD = Math.PI/180, DAY_MS = 86400000, J1970=2440588, J2000=2451545, OBLIQ = RAD*23.4397;
function toDays(date){ return date.valueOf()/DAY_MS - 0.5 + J1970 - J2000; }
function solarMeanAnomaly(d){ return RAD*(357.5291 + 0.98560028*d); }
function eclipticLongitude(M){
  const C = RAD*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M));
  return M + C + RAD*102.9372 + Math.PI;
}
function declination(l){ return Math.asin(Math.sin(l)*Math.sin(OBLIQ)); }
function rightAscension(l){ return Math.atan2(Math.sin(l)*Math.cos(OBLIQ), Math.cos(l)); }
function siderealTime(d, lw){ return RAD*(280.16 + 360.9856235*d) - lw; }
function solarElevationDeg(date, lat, lon){
  const lw = RAD*(-lon), phi = RAD*lat, d = toDays(date);
  const M = solarMeanAnomaly(d), L = eclipticLongitude(M);
  const dec = declination(L), ra = rightAscension(L);
  const H = siderealTime(d, lw) - ra;
  const alt = Math.asin(Math.sin(phi)*Math.sin(dec) + Math.cos(phi)*Math.cos(dec)*Math.cos(H));
  return alt/RAD;
}

/* ==========================================================================================
   §2 엔진 — 시간대 1개(slot)에 대한 계산 (순수 함수, UI 없이 검증 가능)
   ========================================================================================== */
function computeSlot({ uvi, tempC, rh, skinType, clothKey, spfOn }){
  const med = MED[skinType] || MED.III;
  const spf = spfOn ? 30 : 1; // §2: 안 바르면 SPF=1. (SPF30은 "발랐음" 토글의 대표값으로 사용)
  const fbsa = FBSA[clothKey];
  let vitaminMin = Infinity, burnMin = Infinity;
  if (uvi > 0) {
    vitaminMin = (K_VITAMIN * med * fbsa) / (UVI_FACTOR * uvi);
    burnMin    = (med * spf)            / (UVI_FACTOR * uvi);
  }
  const hi = heatIndexC(tempC, rh);
  const heat = heatCap(hi);
  const candidates = [
    { label:"비타민D 필요시간", minutes: vitaminMin, key:"vitamin" },
    { label:"화상 한계시간",   minutes: burnMin,    key:"burn" },
    { label:"열 안전 상한",     minutes: heat.max,   key:"heat" }
  ];
  candidates.sort((a,b)=>a.minutes-b.minutes);
  const limited = candidates[0];
  const finalMinutes = Number.isFinite(limited.minutes) ? Math.round(limited.minutes) : 0;
  return { vitaminMin, burnMin, heatMax: heat.max, heatMsg: heat.msg, hi, limitedBy: limited.key, finalMinutes };
}

/** §2 "창이 열리는 조건" — 셋 다 만족해야 함 */
function windowOpens({ elevationDeg, finalMinutes, heatMax }){
  return elevationDeg >= 45 && heatMax > 0 && finalMinutes > 0 && finalMinutes <= 60;
}

const LIMIT_LABEL = { vitamin:"비타민D 필요시간", burn:"화상 한계시간", heat:"열 안전 상한" };

/* ==========================================================================================
   1층 — 기상청 API 연동 (단기예보 + 생활기상지수/자외선지수)
   이 레이어의 역할은 딱 하나: computeDayResult()가 기대하는 형태
     forecast.hourly = { time:[...], uv_index:[...], temperature_2m:[...], relative_humidity_2m:[...] }
     forecast.daily  = { sunrise:[today, tomorrow], sunset:[today, tomorrow] }
   를 채워서 돌려주는 것. §2~§4의 계산 엔진(computeSlot/computeDayResult)은 이 아래
   코드를 전혀 신경 쓰지 않고 이전(Open-Meteo)과 똑같이 동작한다 — "API는 계산 엔진을
   바꾸는 게 아니라 실제 데이터를 공급하는 역할만 한다"는 요청을 그대로 지킨 구조다.

   실제 기상청 서버 호출은 브라우저가 직접 하지 않는다. /proxy 의 Cloudflare Worker가
   대신 호출한다(인증키를 브라우저에 노출하지 않기 위함 — 아래 "인증키 보안" 참고).
   ========================================================================================== */

/* ---- 위경도 → 기상청 격자좌표(nx, ny) 변환 ----
   기상청이 공개한 LCC(Lambert Conformal Conic) 격자 변환 공식 그대로 구현.
   상수/알고리즘 출처: 기상청 단기예보 API 활용가이드에 실린 공식(널리 검증된 표준 구현).
   검증: (37.579871128849334, 126.98935225645432) → (60, 127) — 공식 예제와 일치 확인함. */
const KMA_GRID = { RE:6371.00877, GRID:5.0, SLAT1:30.0, SLAT2:60.0, OLON:126.0, OLAT:38.0, XO:43, YO:136 };
function convertToKmaGrid(lat, lon){
  const DEGRAD = Math.PI / 180.0;
  const { RE:re0, GRID, SLAT1, SLAT2, OLON, OLAT, XO, YO } = KMA_GRID;
  const re = re0 / GRID;
  const slat1 = SLAT1 * DEGRAD, slat2 = SLAT2 * DEGRAD;
  const olon = OLON * DEGRAD, olat = OLAT * DEGRAD;
  let sn = Math.tan(Math.PI*0.25 + slat2*0.5) / Math.tan(Math.PI*0.25 + slat1*0.5);
  sn = Math.log(Math.cos(slat1)/Math.cos(slat2)) / Math.log(sn);
  let sf = Math.tan(Math.PI*0.25 + slat1*0.5);
  sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
  let ro = Math.tan(Math.PI*0.25 + olat*0.5);
  ro = re * sf / Math.pow(ro, sn);
  let ra = Math.tan(Math.PI*0.25 + lat*DEGRAD*0.5);
  ra = re * sf / Math.pow(ra, sn);
  let theta = lon*DEGRAD - olon;
  if (theta > Math.PI) theta -= 2.0*Math.PI;
  if (theta < -Math.PI) theta += 2.0*Math.PI;
  theta *= sn;
  const nx = Math.floor(ra*Math.sin(theta) + XO + 0.5);
  const ny = Math.floor(ro - ra*Math.cos(theta) + YO + 0.5);
  return { nx, ny };
}

/* ---- 단기예보 base_date/base_time 계산 ----
   발표시각: 02,05,08,11,14,17,20,23시(3시간 간격). 발표 후 API 반영까지 다소 지연이
   있어(대략 10분 내외) 안전마진을 두고, 그 안전마진을 적용한 시각 기준으로 "가장
   최근에 지난 발표시각"을 찾는다. 자정 전후(0~2시)에는 전날 23시 발표자료를 쓴다. */
const VILAGE_BASE_HOURS = [2,5,8,11,14,17,20,23];
const VILAGE_SAFETY_MIN = 10;
function getVilageBaseDateTime(now){
  const d = new Date(now.getTime() - VILAGE_SAFETY_MIN*60000);
  const hour = d.getHours();
  let baseHour = null;
  for (let i=VILAGE_BASE_HOURS.length-1;i>=0;i--){
    if (VILAGE_BASE_HOURS[i] <= hour){ baseHour = VILAGE_BASE_HOURS[i]; break; }
  }
  const baseDate = new Date(d);
  if (baseHour === null){ baseHour = 23; baseDate.setDate(baseDate.getDate()-1); }
  const y = baseDate.getFullYear(), m = String(baseDate.getMonth()+1).padStart(2,"0"), day = String(baseDate.getDate()).padStart(2,"0");
  return { base_date: `${y}${m}${day}`, base_time: String(baseHour).padStart(2,"0")+"00" };
}

/* ---- 위경도 → 생활기상지수(자외선지수) API의 areaNo ----
   ⚠️ 미확정 항목: 자외선지수 API는 nx/ny 격자가 아니라 별도의 10자리 지역코드(areaNo)를
   쓴다. 서울(areaNo="1100000000")은 실제 호출로 확인했지만, 나머지 16개 시/도 코드는
   법정동코드의 시/도 접두코드(11=서울,26=부산,27=대구,28=인천,29=광주,30=대전,31=울산,
   36=세종,41=경기,42=강원,43=충북,44=충남,45=전북,46=전남,47=경북,48=경남,50=제주)에
   0을 채운 값으로 "추정"한 것이며, 아직 실제 API로 하나하나 검증하지는 못했다.
   정확한 표를 구하면(또는 실제 호출로 검증되면) 아래 표만 바꾸면 된다. */
const AREA_NO_TABLE = [
  { code:"1100000000", name:"서울", lat:37.5665, lon:126.9780 },
  { code:"2600000000", name:"부산", lat:35.1796, lon:129.0756 },
  { code:"2700000000", name:"대구", lat:35.8714, lon:128.6014 },
  { code:"2800000000", name:"인천", lat:37.4563, lon:126.7052 },
  { code:"2900000000", name:"광주", lat:35.1595, lon:126.8526 },
  { code:"3000000000", name:"대전", lat:36.3504, lon:127.3845 },
  { code:"3100000000", name:"울산", lat:35.5384, lon:129.3114 },
  { code:"3600000000", name:"세종", lat:36.4801, lon:127.2890 },
  { code:"4100000000", name:"경기", lat:37.4138, lon:127.5183 },
  { code:"4200000000", name:"강원", lat:37.8228, lon:128.1555 },
  { code:"4300000000", name:"충북", lat:36.6357, lon:127.4917 },
  { code:"4400000000", name:"충남", lat:36.5184, lon:126.8000 },
  { code:"4500000000", name:"전북", lat:35.7175, lon:127.1530 },
  { code:"4600000000", name:"전남", lat:34.8161, lon:126.4630 },
  { code:"4700000000", name:"경북", lat:36.4919, lon:128.8889 },
  { code:"4800000000", name:"경남", lat:35.4606, lon:128.2132 },
  { code:"5000000000", name:"제주", lat:33.4996, lon:126.5312 },
];
function nearestAreaNo(lat, lon){
  let best = AREA_NO_TABLE[0], bestDist = Infinity;
  for (const a of AREA_NO_TABLE){
    const dLat = lat - a.lat, dLon = (lon - a.lon) * 0.8; // 한반도 위도 근처 보정(대략치)
    const dist = dLat*dLat + dLon*dLon;
    if (dist < bestDist){ bestDist = dist; best = a; }
  }
  return best.code;
}

/* ---- 응답 파서: 단기예보(getVilageFcst) ----
   실제 응답 구조(공식 문서로 확인): response.body.items.item[] 각 원소가
   {category, fcstDate, fcstTime, fcstValue, nx, ny}. TMP=기온, REH=습도만 사용한다
   (요청하신 강수형태/하늘상태는 category PTY/SKY로 함께 들어오지만, 현재 계산
   엔진은 기온·습도만 입력으로 받으므로 이 두 값만 뽑아 쓴다). */
function kmaDateTimeToDate(fcstDate, fcstTime){
  const y=+fcstDate.slice(0,4), mo=+fcstDate.slice(4,6), da=+fcstDate.slice(6,8);
  const hh=+fcstTime.slice(0,2), mi=+fcstTime.slice(2,4);
  return new Date(y, mo-1, da, hh, mi, 0); // KST(로컬) 시각으로 해석
}
function parseVilageFcst(json){
  const items = json?.response?.body?.items?.item || [];
  const tempMap = new Map(), rhMap = new Map();
  for (const it of items){
    if (it.category !== "TMP" && it.category !== "REH") continue;
    const key = it.fcstDate + it.fcstTime;
    const t = kmaDateTimeToDate(it.fcstDate, it.fcstTime);
    const val = Number(it.fcstValue);
    if (!Number.isFinite(val)) continue;
    if (it.category === "TMP") tempMap.set(key, { time:t, value:val });
    else rhMap.set(key, { time:t, value:val });
  }
  return { tempMap, rhMap };
}

/* ---- 응답 파서: 생활기상지수(자외선지수) ----
   실제 응답 예시(사용자가 data.go.kr에서 직접 호출해 확인해 준 값):
   { response: { header:{resultCode:"00",...}, body:{ items:{ item:[
       { code:"A07_2", areaNo:"1100000000", date:"2026090318",
         h0:"0", h3:"0", ..., h12:"1", h15:"7", h18:"8", ..., h75:"0" } ] } } } }
   date는 "YYYYMMDDHH" 형식의 발표 기준시각이고, h0/h3/h6...h75는 그 시각으로부터
   3시간 간격으로 75시간(약 3일) 뒤까지의 자외선지수 예보값이다. */
function parseUvIdx(json){
  const item = json?.response?.body?.items?.item?.[0];
  if (!item || !item.date || item.date.length < 10) return [];
  const y=+item.date.slice(0,4), mo=+item.date.slice(4,6), da=+item.date.slice(6,8), hh=+item.date.slice(8,10);
  const base = new Date(y, mo-1, da, hh, 0, 0);
  const out = [];
  for (const key of Object.keys(item)){
    const m = /^h(\d+)$/.exec(key);
    if (!m) continue;
    const val = Number(item[key]);
    if (!Number.isFinite(val)) continue;
    out.push({ time: new Date(base.getTime() + (+m[1])*3600000), uvi: val });
  }
  out.sort((a,b)=>a.time-b.time);
  return out;
}

/* ---- 두 응답을 계산 엔진이 원하는 시간별 배열로 합치기 ----
   단기예보는 1시간 간격, 자외선지수는 3시간 간격이라 촘촘함이 다르다. 자외선지수는
   "그 시각 기준으로 가장 최근에 발표된 3시간 구간 값"을 계단식으로 채워 넣는다 —
   새로운 값을 만들어내는 게 아니라 있는 값을 그대로 유지하는 것뿐이므로 계산 엔진의
   공식(§2)에는 아무 영향이 없다. */
function nearestUvAt(uvSeries, t){
  if (!uvSeries.length) return 0;
  let best = uvSeries[0].uvi;
  for (const p of uvSeries){
    if (p.time.getTime() <= t.getTime()) best = p.uvi; else break;
  }
  return best;
}
function buildHourlyForecast(vilageParsed, uvSeries){
  const { tempMap, rhMap } = vilageParsed;
  const keys = Array.from(tempMap.keys()).filter(k=>rhMap.has(k)).sort();
  const time=[], temperature_2m=[], relative_humidity_2m=[], uv_index=[];
  for (const key of keys){
    const tE = tempMap.get(key), rE = rhMap.get(key);
    time.push(toLocalIsoNoZ(tE.time));
    temperature_2m.push(tE.value);
    relative_humidity_2m.push(rE.value);
    uv_index.push(nearestUvAt(uvSeries, tE.time));
  }
  return { time, temperature_2m, relative_humidity_2m, uv_index };
}
function toLocalIsoNoZ(d){
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:00`;
}

/* ---- 일출/일몰: 기상청 API가 제공하지 않으므로, 이미 있는 태양 위치 공식(§4 아래
   solarElevationDeg)을 그대로 재사용해 고도각이 0°를 넘나드는 시각을 1분 간격으로
   스캔해서 구한다. 새 계산식을 추가하는 게 아니라 기존 엔진 함수를 다른 용도로
   한 번 더 쓰는 것뿐이며, 결과는 화면 표시용으로만 쓰인다(엔진 계산에는 영향 없음). */
function computeSunriseSunset(dateStr, lat, lon){
  // 정오(그날 태양이 가장 높은 시각) 이전의 "마지막 뜨는 시각"과, 그 바로 다음에
  // 오는 "지는 시각"을 한 쌍으로 묶는다 — 뜨는 시각과 지는 시각을 각각 따로
  // "정오와 가장 가까운 값"으로 고르면, 기기 시간대가 실제 좌표와 크게 어긋난
  // 경우(예: 기기가 UTC, 대상 좌표는 서울) 서로 다른 주야 주기의 값이 잘못 짝지어질
  // 수 있다. 반드시 연속된 같은 주기의 뜨고-지는 시각 쌍이 되도록 이렇게 계산한다.
  const dayStart = new Date(dateStr+"T00:00:00");
  const noon = new Date(dayStart.getTime() + 12*3600000);
  const scanStart = new Date(dayStart.getTime() - 36*3600000);
  const scanEnd = new Date(dayStart.getTime() + 60*3600000);
  const events = [];
  let prevElev = null;
  for (let t = scanStart.getTime(); t <= scanEnd.getTime(); t += 60000){
    const cur = new Date(t);
    const elev = solarElevationDeg(cur, lat, lon);
    if (prevElev !== null){
      if (prevElev < 0 && elev >= 0) events.push({ type:"rise", time:cur });
      else if (prevElev >= 0 && elev < 0) events.push({ type:"set", time:cur });
    }
    prevElev = elev;
  }
  let riseIdx = -1;
  for (let i=0;i<events.length;i++){
    if (events[i].type === "rise" && events[i].time <= noon) riseIdx = i;
  }
  if (riseIdx === -1) return { sunrise:null, sunset:null };
  const rise = events[riseIdx].time;
  const setEvt = events.slice(riseIdx+1).find(e=>e.type==="set");
  return { sunrise: rise, sunset: setEvt ? setEvt.time : null };
}
function buildDaily(lat, lon){
  const d0 = computeSunriseSunset(todayStr(0), lat, lon);
  const d1 = computeSunriseSunset(todayStr(1), lat, lon);
  return {
    sunrise: [ d0.sunrise ? toLocalIsoNoZ(d0.sunrise) : null, d1.sunrise ? toLocalIsoNoZ(d1.sunrise) : null ],
    sunset:  [ d0.sunset  ? toLocalIsoNoZ(d0.sunset)  : null, d1.sunset  ? toLocalIsoNoZ(d1.sunset)  : null ],
  };
}

/* ---- 네트워크 호출 + 사용자용 오류 메시지 ---- */
class FetchStageError extends Error {
  constructor(stage, detail){ super(`fetch stage failed: ${stage}`); this.stage = stage; this.detail = detail; }
}
async function fetchJsonWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    const res = await fetch(url, { signal: controller.signal });
    let body = null;
    try{ body = await res.json(); }catch(e){}
    return { httpOk: res.ok, status: res.status, apiOk: !!(body && body.ok), body };
  }catch(networkError){
    return { httpOk:false, status:0, apiOk:false, body:null, networkError };
  }finally{
    clearTimeout(timer);
  }
}
function friendlyErrorMessage(e){
  if (e instanceof FetchStageError){
    if (e.stage === "no-proxy") return "앱 설정이 아직 끝나지 않았어요. 잠시 후 다시 시도해주세요.";
    if (e.stage === "vilage") return "기상청 단기예보 정보를 불러오지 못했어요. 잠시 후 다시 시도해주세요.";
    if (e.stage === "empty") return "오늘의 예보 데이터가 비어 있어요. 잠시 후 다시 시도해주세요.";
  }
  return "현재 날씨 정보를 불러오지 못했어요.\n잠시 후 다시 시도해주세요.";
}

/* ==========================================================================================
   1층 — 기상청 API 호출 진입점. 하루 중 같은 위치·3시간 이내 재호출은 캐시를 그대로 쓴다
   (단기예보 발표 주기가 3시간이므로 그 이상 오래된 캐시는 자동으로 버려진다 — §"캐싱" 요구사항).
   ========================================================================================== */
const FORECAST_CACHE_TTL_MS = 3*60*60*1000; // 3시간
async function fetchForecast(lat, lon){
  const today = todayStr();
  const cached = Store.getCache();
  const cacheFresh = cached && cached.date === today && closeEnough(cached.lat, lat) && closeEnough(cached.lon, lon)
    && cached.fetchedAt && (Date.now() - cached.fetchedAt) < FORECAST_CACHE_TTL_MS;
  if (cacheFresh) return { data: cached, fromCache: true };

  if (!KMA_PROXY_BASE){
    if (cached) return { data: cached, fromCache: true, stale: true, userMessage: friendlyErrorMessage(new FetchStageError("no-proxy")) };
    return { data: null, fromCache: false, error: true, userMessage: friendlyErrorMessage(new FetchStageError("no-proxy")) };
  }

  try{
    const { nx, ny } = convertToKmaGrid(lat, lon);
    const { base_date, base_time } = getVilageBaseDateTime(new Date());
    const areaNo = nearestAreaNo(lat, lon);

    const vilageUrl = `${KMA_PROXY_BASE}/vilage-fcst?nx=${nx}&ny=${ny}&base_date=${base_date}&base_time=${base_time}`;
    const uvUrl = `${KMA_PROXY_BASE}/uv-idx?areaNo=${areaNo}`;
    const [vilageRes, uvRes] = await Promise.all([
      fetchJsonWithTimeout(vilageUrl, 10000),
      fetchJsonWithTimeout(uvUrl, 10000),
    ]);

    if (!vilageRes.httpOk || !vilageRes.apiOk){
      throw new FetchStageError("vilage", vilageRes);
    }
    const vilageParsed = parseVilageFcst(vilageRes.body.data);

    let uvSeries = [], uvWarning = null;
    if (uvRes.httpOk && uvRes.apiOk){
      uvSeries = parseUvIdx(uvRes.body.data);
      if (!uvSeries.length) uvWarning = "자외선지수 응답을 이해하지 못해 이 시간대는 0으로 표시됩니다.";
    } else {
      uvWarning = "자외선지수 정보를 가져오지 못해 이 시간대는 0으로 표시됩니다.";
    }

    const hourly = buildHourlyForecast(vilageParsed, uvSeries);
    if (!hourly.time.length) throw new FetchStageError("empty");

    const daily = buildDaily(lat, lon);
    const packed = { date: today, lat, lon, hourly, daily, fetchedAt: Date.now(), uvWarning };
    Store.setCache(packed);
    return { data: packed, fromCache: false, uvWarning };
  }catch(e){
    const userMessage = friendlyErrorMessage(e);
    if (cached) return { data: cached, fromCache: true, stale: true, userMessage: userMessage + " 최근 저장된 정보로 대신 보여드릴게요." };
    return { data: null, fromCache: false, error: true, userMessage };
  }
}
function closeEnough(a,b){ return Math.abs(a-b) < 0.01; }
function todayStr(offsetDays){
  const d = new Date();
  if (offsetDays) d.setDate(d.getDate()+offsetDays);
  return d.toISOString().slice(0,10);
}

/* ==========================================================================================
   2층+3층 — 하루 계산 + §4 기상·계절 모드 분기
   ========================================================================================== */
function computeDayResult(forecast, profile, clothKey, spfOn, offsetDays){
  if (!forecast || !forecast.hourly) return null;
  const { time, uv_index, temperature_2m, relative_humidity_2m } = forecast.hourly;
  const targetStr = todayStr(offsetDays);

  const slots = [];
  let maxElevation = -90;
  let maxHeatIndex = -99;

  for (let i=0;i<time.length;i++){
    const t = new Date(time[i]);
    if (t.toISOString().slice(0,10) !== targetStr) continue;
    const elev = solarElevationDeg(t, profile.lat, profile.lon);
    const uvi = uv_index[i] ?? 0;
    const temp = temperature_2m[i] ?? 20;
    const rh = relative_humidity_2m[i] ?? 50;
    const r = computeSlot({ uvi, tempC:temp, rh, skinType:profile.skinType, clothKey, spfOn });
    const open = windowOpens({ elevationDeg:elev, finalMinutes:r.finalMinutes, heatMax:r.heatMax });
    maxElevation = Math.max(maxElevation, elev);
    maxHeatIndex = Math.max(maxHeatIndex, r.hi);
    slots.push({ time:t, hour:t.getHours(), elev, uvi, temp, rh, ...r, open });
  }
  if (!slots.length) return null;

  /* §4 판정 순서대로 검사해서 처음 걸리는 모드를 적용 */
  let mode;
  if (maxElevation < 45) {
    mode = "winter"; // 1. 겨울
  } else if (maxHeatIndex >= 31) {
    // 2. 폭염 — 오전 창만 개방, 정오·오후는 아예 제시하지 않음 ("오전" = 12시 이전)
    slots.forEach(s=>{ if (s.hour >= 12) s.open = false; });
    mode = "heatwave";
  }
  if (!mode) {
    const openCount = slots.filter(s=>s.open).length;
    mode = openCount === 0 ? "rain" : "normal"; // 3. 장마·흐림 / 4. 평상
  }

  const windows = slots.filter(s=>s.open);
  const daily = forecast.daily || null;
  return {
    dateStr: targetStr, slots, mode, windows, maxElevation, maxHeatIndex,
    sunrise: daily && daily.sunrise ? daily.sunrise[0] : null,
    sunset: daily && daily.sunset ? daily.sunset[0] : null
  };
}

/* ==========================================================================================
   저장·플랫폼 레이어 — localStorage 기반 Store (아키텍처 다이어그램의 "로컬 저장소")
   ========================================================================================== */
const LS_KEYS = {
  profile: "hauri_profile",       // skinType, lat, lon, cityName
  settings: "hauri_settings",     // wakeTime(미정 필드), supplementOn, clothIdx, spfOn
  seen: "hauri_seen_onboarding",
  cache: "hauri_forecast_cache",
  history: "hauri_exposure_history",   // { "YYYY-MM-DD": ratio(0~1) }
  modeLog: "hauri_mode_log",           // { "YYYY-MM-DD": mode }
  timer: "hauri_timer"                 // { running, endAt, totalSec, startDateStr } — 새로고침/재접속 복원용
};
function loadJSON(k, fallback){ try{ const v = localStorage.getItem(k); return v!==null ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

const Store = {
  getProfile(){ return loadJSON(LS_KEYS.profile, null); },
  setProfile(p){ saveJSON(LS_KEYS.profile, p); },
  getSettings(){ return loadJSON(LS_KEYS.settings, { wakeTime:"", supplementOn:false, clothIdx:0, spfOn:false }); },
  setSettings(s){ saveJSON(LS_KEYS.settings, s); },

/* 모바일에서는 GPS 콜드스타트(첫 위치 요청)가 실내·약전파 환경에서 8초를
   넘기는 경우가 흔하다. HTTPS(GitHub Pages)에서만 geolocation이 동작하므로
   여기서 타임아웃이 나면 그냥 실패로 보이지 않게 넉넉히 잡고, 5분 이내
   캐시된 위치가 있으면 그걸 바로 써서 체감 속도를 높인다. */
const GEO_OPTS = { enableHighAccuracy:false, timeout:12000, maximumAge:300000 };

/* ---- iOS 알림 지원 여부 판별 ----
   iOS Safari는 일반 브라우저 탭에서는 Notification API를 아예 지원하지 않고,
   "홈 화면에 추가"로 설치되어 standalone(앱처럼 실행)으로 열렸을 때만,
   그것도 서비스 워커를 거쳐야만 알림을 띄울 수 있다(iOS 16.4+).
   아래 두 함수는 그 상태를 판별해 설정 화면에 안내 문구를 보여주는 용도로만 쓰인다. */
function isIOS(){
  return /iP(hone|od|ad)/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS는 Mac으로 위장하는 경우가 있음
}
function isStandalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

/* ---- 서비스 워커 등록 ----
   서버 푸시(Push API)는 쓰지 않는다 — 이 앱은 백엔드가 없는 클라이언트 전용 구조를 유지한다.
   서비스 워커를 등록하는 유일한 이유는, iOS에서 Notification API가 서비스 워커의
   showNotification()을 거쳐야만 동작하기 때문이다(아래 fireNotification 참고).
   등록에 실패해도(구형 브라우저 등) 앱 동작에는 영향이 없다 — 기존 new Notification()
   또는 토스트로 자동 대체된다. */
function registerServiceWorker(){
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
registerServiceWorker();

/* 자외선지수 구간 라벨/색 — 기상청·WHO가 함께 쓰는 4단계 구분(매우낮음 0~2 · 보통 3~5 ·
   높음 6~7 · 매우높음 8+)을 그대로 따른다. UVI 자체의 계산식(§2 UVI_FACTOR 등)은 전혀
   건드리지 않고, 이미 계산된 uvi 값을 표시 목적으로만 구간화하는 순수 표시용 함수다. */
function categorizeUVI(uvi){
  if (uvi >= 8) return { label:"매우높음", color:"#E3543C" };
  if (uvi >= 6) return { label:"높음",     color:"#F0913F" };
  if (uvi >= 3) return { label:"보통",     color:"#F0C23F" };
  return { label:"매우낮음", color:"#4CAF7D" };
}
/* 오늘 목표 대비 지금까지 채운 분(分) — 새 계산식이 아니라 이미 있는 두 값
   (오늘 기록된 노출 비율 Store.getHistory()[today], 그리고 §2 엔진이 계산한
   w.finalMinutes)을 곱해서 화면에 보여주기만 한다. */
function todayProgressMinutes(finalMinutes){
  const ratio = Store.getHistory()[todayStr()] || 0;
  return { ratio, minutes: Math.round(ratio * finalMinutes) };
}
/* "연속 달성일" — countNoWindowStreak()(장마·겨울 연속일)와 정확히 같은 방식으로,
   반대 조건(그날 노출 기록이 있었는지)을 Store.getHistory()에서 세는 표시 전용 헬퍼.
   새 저장 항목을 만들지 않고 기존 history 데이터만 읽는다. */
function countAchieveStreak(){
  const history = Store.getHistory();
  let streak = 0;
  for (let i=0;i<28;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    if ((history[key]||0) > 0) streak++; else break;
  }
  return streak;
}

function upcomingOrCurrentWindow(day){
  const now = new Date();
  // 이미 열려 있는(현재 시각을 포함하는) 창 우선, 없으면 이후 첫 창
  const cur = day.windows.find(w => w.hour === now.getHours());
  if (cur) return cur;
  return day.windows.find(w => w.time > now) || day.windows[0];
}

function notifBannerHTML(day){
  const w = upcomingOrCurrentWindow(day);
  if (!w) return "";
  const now = new Date();
  const diffMin = Math.round((w.time - now) / 60000);
  if (diffMin > 0 && diffMin <= 15){
    const count = day.windows.length;
    const text = `${fmtHM(w.time)}부터 ${w.finalMinutes}분, ${count===1?"오늘 유일한 창입니다":"오늘 " + count + "개 창 중 하나입니다"}`;
    return `<div class="banner info" style="margin-bottom:14px">🔔 ${diffMin}분 후 노출 창이 열립니다 — <b>${text}</b></div>`;
  }
  return "";
}

/* ---- 체내 저장량 추적(주간 충전률): 최근 노출/필요 비율에 반감기 감쇠 적용 ---- */
function weeklyChargePct(){
  const history = Store.getHistory();
  const today = new Date();
  let weighted = 0, weightSum = 0;
  const halfLife = 18; // days, §9: 반감기 약 2~3주(25(OH)D 기준)의 중간값 근처
  for (let i=0;i<28;i++){
    const d = new Date(today); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const ratio = history[key] || 0; // 0~1 (그날 목표 대비 채운 비율)
    const w = Math.pow(0.5, i/halfLife);
    weighted += ratio*w; weightSum += w;
  }
  const pct = weightSum>0 ? Math.round((weighted/weightSum)*100) : 0;
  return Math.max(0, Math.min(100, pct));
}

/* ---- §9: 창이 열리기 15분 전 알림 (탭이 열려 있는 동안만 — 실제 백그라운드 푸시는 미구현) ---- */
function scheduleWindowNotification(day){
  clearTimeout(state.notifTimer);
  const w = day.windows.find(w => w.time > new Date());
  if (!w) return;
  const notifyAt = new Date(w.time.getTime() - 15*60000);
  const ms = notifyAt - new Date();
  if (ms <= 0) return; // 이미 15분 이내 구간이면 배너로만 안내(위 notifBannerHTML)
  state.notifTimer = setTimeout(()=>{
    const count = day.windows.length;
    const text = `${fmtHM(w.time)}부터 ${w.finalMinutes}분, ${count===1?"오늘 유일한 창입니다":"오늘 " + count + "개 창 중 하나입니다"}`;
    fireNotification("🔔 노출 창이 곧 열립니다", text);
    if (state.tab === "home") renderHome();
  }, Math.min(ms, 2147483000));
}
function fireNotification(title, body){
  showToast(title + " — " + body, 6000); // 항상 앱 내 토스트는 띄운다(모든 브라우저 공통 최후 수단)
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try{
    if ("serviceWorker" in navigator){
      // iOS(홈 화면에 추가된 상태)는 반드시 이 경로로만 알림이 뜬다.
      // 데스크톱/안드로이드 크롬도 이 경로로 정상 동작하므로 항상 우선 시도한다.
      navigator.serviceWorker.ready.then(reg=>{
        if (reg && reg.showNotification){
          reg.showNotification(title, { body, icon:"icon.svg", badge:"icon.svg" });
        } else {
          new Notification(title, { body });
        }
      }).catch(()=>{
        try{ new Notification(title, { body }); }catch(e){}
      });
    } else {
      new Notification(title, { body }); // 서비스 워커 미지원 구형 브라우저 폴백
    }
  }catch(e){}
}

/** 실행 중인 타이머 도중 옷차림·SPF·피부타입·위치 등 조건이 바뀌었을 때
 *  이미 흘려보낸 시간(elapsed)은 그대로 인정하고, 남은 시간만 새 조건 기준으로
 *  다시 계산한다. §9 "옷차림·SPF 토글 즉시 반영해 남은 시간 재계산"의 실제 구현. */
function applyConditionChangeToTimer(){
  const wasRunning = state.timer.running;
  const elapsedSec = wasRunning ? Math.max(0, state.timer.totalSec - state.timer.remainSec) : 0;
  recomputeDay();
  if (wasRunning){
    const s = currentSlotNow();
    const newTotal = s ? s.finalMinutes*60 : 0;
    const newRemain = newTotal - elapsedSec;
    state.timer.totalSec = newTotal;
    if (newRemain <= 0){
      // 조건이 바뀌면서 이미 처방 시간을 다 채운 경우 — 즉시 종료 처리
      logExposure(newTotal, newTotal, state.timer.startDateStr);
      state.timer.running = false;
      Store.clearTimer();
      clearInterval(timerInterval);
      showToast("옷차림·SPF 변경으로 처방 시간을 이미 채웠습니다. 들어오세요.", 6000);
    } else {
      state.timer.remainSec = newRemain;
      state.timer.endAt = Date.now() + newRemain*1000;
      Store.setTimer({ running:true, endAt:state.timer.endAt, totalSec:state.timer.totalSec, startDateStr:state.timer.startDateStr });
      showToast("조건 변경으로 남은 시간이 " + Math.ceil(newRemain/60) + "분으로 갱신되었습니다.", 4000);
    }
  }
  renderTimer(); if(state.tab==='home') renderHome();
}
function fmtSec(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}
let timerInterval = null;
function tickTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    if (!state.timer.running) { clearInterval(timerInterval); return; }
    state.timer.remainSec = Math.max(0, Math.round((state.timer.endAt - Date.now())/1000));
    if (state.tab === "timer") renderTimer();
    if (state.timer.remainSec <= 0){
      state.timer.running = false;
      logExposure(state.timer.totalSec, state.timer.totalSec, state.timer.startDateStr);
      Store.clearTimer();
      clearInterval(timerInterval);
      if (state.tab === "timer") renderTimer();
      if (state.tab === "week") renderWeek();
      if (state.tab === "home") renderHome();
      fireNotification("들어오세요", "오늘 처방 시간이 끝났습니다.");
    }
  }, 1000);
}
/** dateStr을 안 주면 오늘 날짜로 기록한다. 자정을 넘겨 끝난 세션은
 *  세션이 "시작된" 날짜(startDateStr)로 기록해야 주간 이력이 왜곡되지 않는다. */
function logExposure(elapsedSec, totalSec, dateStr){
  if (totalSec<=0) return;
  const key = dateStr || todayStr();
  const history = Store.getHistory();
  const ratio = Math.max(0, Math.min(1, elapsedSec/totalSec));
  history[key] = Math.max(history[key]||0, ratio);
  Store.setHistory(history);
}

/* ==========================================================================================
   타이머 상태 복원 — 새로고침 / 백그라운드 복귀 / 재접속 시 실제 경과 시간 기준으로 동기화
   ========================================================================================== */
/** 부팅 시 1회 호출. localStorage에 "실행 중"으로 저장된 세션이 있으면
 *  경과 시간을 실시간으로 다시 계산해 이어서 카운트하거나, 자리를 비운 사이
 *  이미 끝나 있었다면 전체 노출로 기록하고 안내한다. */
function resumeTimerIfAny(){
  const saved = Store.getTimer();
  if (!saved || !saved.running) return;
  const remainSec = Math.max(0, Math.round((saved.endAt - Date.now())/1000));
  if (remainSec <= 0){
    logExposure(saved.totalSec, saved.totalSec, saved.startDateStr);
    Store.clearTimer();
    showToast("자리를 비운 사이 노출 시간이 끝나 자동으로 기록되었습니다.", 6000);
    return;
  }
  state.timer = { running:true, endAt:saved.endAt, totalSec:saved.totalSec, remainSec, startDateStr:saved.startDateStr };
  tickTimer();
}

/** 탭이 백그라운드에 있는 동안 setInterval이 늦게 돌거나 아예 멈춰도(모바일 브라우저의
 *  일반적인 동작), 화면이 다시 보이는 순간 endAt 기준으로 즉시 재동기화한다. */
document.addEventListener("visibilitychange", ()=>{
  if (document.visibilityState !== "visible" || !state.timer.running) return;
  const remainSec = Math.max(0, Math.round((state.timer.endAt - Date.now())/1000));
  state.timer.remainSec = remainSec;
  if (remainSec <= 0){
    state.timer.running = false;
    logExposure(state.timer.totalSec, state.timer.totalSec, state.timer.startDateStr);
    Store.clearTimer();
    clearInterval(timerInterval);
    fireNotification("들어오세요", "오늘 처방 시간이 끝났습니다.");
    if (state.tab === "week") renderWeek();
    if (state.tab === "home") renderHome();
  }
  if (state.tab === "timer") renderTimer();
});

            <div class="pct">${d.ratio>0? Math.round(d.ratio*100)+"%":"—"}</div>
            <div class="b ${d.ratio>0?'fill':''} ${d.isToday?'today':''}" style="height:${Math.max(6, d.ratio*104)}px"></div>
            <div class="d">${d.label}</div>
            <div class="chk ${d.ratio>0?'on':'off'}" aria-hidden="true">${d.ratio>0?"✓":""}</div>
          </div>`).join("")}
      </div>
      <p class="small-muted" style="margin-top:12px">막대는 그날 타이머로 실제 기록된 노출 비율입니다. 게이지(%)는 여기에 반감기 감쇠를 적용한 체내 저장량 근사치입니다.</p>
    </div>
    <div class="card">
      <h3>일별 상세 기록</h3>
      <div class="week-daylist">
        ${days.map(d=>`
          <div class="di">
            <div class="dlabel">${d.label}<br><span style="font-size:9.5px;font-weight:700;color:var(--gray3)">${d.dateLabel}</span></div>
            <div class="dbar-track"><div class="dbar-fill" style="width:${Math.round(d.ratio*100)}%"></div></div>
            <div class="dpct">${Math.round(d.ratio*100)}%</div>
          </div>`).join("")}
      </div>
    </div>
    ${noWindowStreak >= 2 ? `
      <div class="card">
        <h3>장마 · ${noWindowStreak}일 연속 노출 창 없음</h3>
        ${dietSupplementCardBody()}
      </div>` : ""}
    <div class="card">
      <h3>축 2 — 생체리듬 <span class="badge-todo">미정</span></h3>
      <p class="small-muted">개발 명세 §6·§10: 생체리듬 축 포함 여부는 아직 팀 내에서 결정되지 않았습니다. 포함될 경우 기상시각 기준 Tmin(심부체온 최저점)으로 빛 노출의 위상 전진/지연을 안내할 예정이며, 현재 계산·추천에는 반영되어 있지 않습니다.</p>
    </div>
  `;
}
function dietSupplementCardBody(){
  const supplementOn = state.settings.supplementOn;
  return `
    <p class="small-muted">→ 연어 100g · 고등어 100g · 달걀 3개로 부족분을 보완할 수 있습니다.</p>
    <p class="small-muted" style="margin-top:10px">→ 보충제를 고려할 구간입니다. 한국인 영양소 섭취기준: 성인 충분섭취량 <b>400 IU/일</b> · 상한 <b>4,000 IU/일</b>.</p>
    ${supplementOn ? `<p class="small-muted" style="margin-top:10px;color:var(--warn)">→ 보충제 복용 중으로 설정되어 있습니다. 합산 상한 초과 여부를 확인하세요. <span class="badge-todo">정확한 합산 IU 계산 미정</span></p>` : ""}
  `;
}
/** modeLog(§4 실제 계산 결과 로그)를 바탕으로 한 정확한 연속 무창일 스트릭 */
function countNoWindowStreak(modeLog){
  let streak = 0;
  for (let i=0;i<21;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const m = modeLog[key];
    if (m === undefined) break;               // 기록 없는 날은 스트릭 계산 중단(데이터 부족)
    if (m === "rain" || m === "winter") streak++; else break;
  }
  return streak;
}

/* ==========================================================================================
   렌더 — 설정
   ========================================================================================== */
function renderSettings(){
  const el = document.getElementById("tab-settings");
  const p = state.profile || {};
  const s = state.settings;
  el.innerHTML = `
    <div class="card">
      <h3>내 정보</h3>
      <div class="set-row">
        <div class="l">피부 타입</div>
        <select id="set-skin">
          ${["I","II","III","IV","V","VI"].map(k=>`<option value="${k}" ${p.skinType===k?"selected":""}>${SKIN_LABEL[k]}${k==="I"?" (기본값)":""}</option>`).join("")}
        </select>
      </div>
      <div class="set-row">
        <div class="l">위치</div>
        <select id="set-city">
          ${CITY_OPTS.map(c=>`<option value="${c.name}" ${p.cityName===c.name?"selected":""}>${c.name}</option>`).join("")}
          <option value="__current__" ${!p.cityName || p.cityName==="현재 위치" ? "selected":""}>현재 위치(GPS)</option>
        </select>
      </div>
      <div class="set-row">
        <div class="l">옷차림</div>
        <div class="r">${CLOTH_LABELS[s.clothIdx]}</div>
      </div>
      <div class="set-row">
        <div class="l">선크림(SPF)</div>
        <div class="r">${s.spfOn?"바름":"안 바름"}</div>
      </div>
      <p class="set-note">옷차림·SPF는 [타이머] 탭에서 바꾸면 즉시 반영됩니다.</p>
    </div>

    <div class="card">
      <h3>축 2 관련 입력 <span class="badge-todo">미정</span></h3>
      <div class="set-row">
        <div class="l">기상 시각</div>
        <input type="time" id="set-wake" value="${s.wakeTime || ""}">
      </div>
      <p class="set-note">§7·§10: 생체리듬(축 2) 포함 여부가 아직 결정되지 않아, 이 값은 저장만 되고 현재 노출시간 계산에는 사용되지 않습니다.</p>
    </div>

    <div class="card">
      <div class="row"><h3 style="margin:0">보충제 복용 중</h3><div class="switch ${s.supplementOn?'on':''}" id="supp-switch" role="switch" aria-checked="${s.supplementOn}" tabindex="0" aria-label="보충제 복용 중"></div></div>
      <p class="set-note">켜두면 장마·겨울 모드의 식이/보충제 안내 카드에 합산 상한(4,000 IU/일) 확인 문구가 추가로 표시됩니다.</p>
    </div>

    <div class="card">
      <h3>알림</h3>
      <div class="set-row">
        <div class="l">브라우저 알림 권한</div>
        <div class="r" id="notif-status">${notifStatusText()}</div>
      </div>
      <button class="btn sm secondary" id="notif-request" style="margin-top:10px">알림 권한 요청</button>
      <button class="btn sm ghost" id="notif-test" style="margin-top:8px">테스트 알림 미리보기</button>
      ${isIOS() && !isStandalone() ? `<p class="set-note" style="color:var(--warn);font-weight:600">iPhone에서는 이 페이지를 먼저 홈 화면에 추가해야 알림이 동작합니다. 공유 버튼 → <b>홈 화면에 추가</b> → 추가된 아이콘으로 다시 열어주세요.</p>` : ""}
      <p class="set-note">${isIOS() ? "홈 화면에 추가한 뒤 앱을 열어둔 동안" : "탭이 열려 있는 동안"} 창이 열리기 15분 전에 알려줍니다. 앱을 완전히 종료한 상태에서 오는 실제 푸시 알림은 별도 서버가 필요해 이 버전에는 없습니다.</p>
    </div>

    <div class="card">
      <h3>기타</h3>
      <button class="btn secondary" id="reset-ob">온보딩 다시 하기</button>
    </div>
    <p class="disclaim">
      이 앱은 공식(비타민D 필요시간 · 화상 한계시간 · 열 안전 상한)의 최솟값으로 오늘의 노출 시간을 안내합니다.
      "증상 → 비타민 추천"이 아니라 공식 기준 인용과 자체 계산 결과만 제공하며, 특정 용량을 권장하지 않습니다.
    </p>
  `;

  document.getElementById("set-skin").onchange = (e)=>{
    state.profile.skinType = e.target.value;
    Store.setProfile(state.profile);
    applyConditionChangeToTimer();
  };
  document.getElementById("set-city").onchange = (e)=>{
    const v = e.target.value;
    if (v === "__current__"){
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(pos=>{
        state.profile.lat = pos.coords.latitude; state.profile.lon = pos.coords.longitude; state.profile.cityName = "현재 위치";
        Store.setProfile(state.profile); boot(); // 위치가 바뀌면 예보를 다시 받아야 하므로 boot()가 recomputeDay까지 처리
      }, ()=> showToast("위치 권한을 가져오지 못했습니다."), GEO_OPTS);
      return;
    }
    const c = CITY_OPTS.find(c=>c.name===v);
    if (c){ state.profile.lat=c.lat; state.profile.lon=c.lon; state.profile.cityName=c.name; Store.setProfile(state.profile); boot(); }
  };
  document.getElementById("set-wake").onchange = (e)=>{
    state.settings.wakeTime = e.target.value; Store.setSettings(state.settings);
  };
  document.getElementById("supp-switch").onclick = ()=>{
    state.settings.supplementOn = !state.settings.supplementOn; Store.setSettings(state.settings);
    renderSettings(); if(state.tab==='home') renderHome();
  };
  document.getElementById("notif-request").onclick = async ()=>{
    try{
      if (!("Notification" in window)){ showToast("이 브라우저는 알림을 지원하지 않습니다."); return; }
      await Notification.requestPermission();
      renderSettings();
    }catch(e){ showToast("알림 권한 요청에 실패했습니다."); }
  };
  document.getElementById("notif-test").onclick = ()=>{
    fireNotification("🔔 노출 창이 곧 열립니다", "09:15부터 18분, 오늘 유일한 창입니다 (예시)");
  };
  document.getElementById("reset-ob").onclick = ()=>{
    Store.setSeen(false);
    location.reload();
  };
}
function notifStatusText(){
  if (!("Notification" in window)) return "미지원";
  return { granted:"허용됨", denied:"거부됨", default:"미요청" }[Notification.permission] || "미요청";
}

/* ==========================================================================================
   탭 전환
   ========================================================================================== */
/* Figma 디자인은 홈 화면 상단바에 현재 위치(예: "서울 강남구")를 작은 배지로 보여준다.
   원본 앱은 시/도 단위의 cityName만 가지고 있어(§: state.profile.cityName, GPS인 경우
   "현재 위치") 구·동 단위까지는 알 수 없다 — 새 데이터를 지어내지 않고 있는 값만
   그대로 노출한다. 홈 탭에서만 보여주고 다른 탭에서는 숨긴다(다른 탭은 topbar-sub를
   그 탭의 안내문구로 그대로 사용해야 하므로). */
function updateTopbarLoc(){
  const el = document.getElementById("topbar-loc");
  if (!el) return;
  if (state.tab === "home" && state.profile && state.profile.cityName){
    document.getElementById("topbar-loc-text").textContent = state.profile.cityName;
    el.classList.remove("hide");
  } else {
    el.classList.add("hide");
  }
}

document.querySelectorAll(".tab").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    state.tab = btn.dataset.tab;
    document.querySelectorAll(".screen").forEach(s=>s.classList.add("hide"));
    document.getElementById("tab-"+state.tab).classList.remove("hide");
    const titles = { home:["일광 처방",""], timer:["타이머","옷차림·SPF 즉시 반영"], week:["주간","충전률 · 이력"], settings:["설정",""] };
    document.getElementById("topbar-title").textContent = titles[state.tab][0];
    document.getElementById("topbar-sub").textContent = titles[state.tab][1];
    updateTopbarLoc();
    if (state.tab==="home") renderHome();
    if (state.tab==="timer") renderTimer();
    if (state.tab==="week") renderWeek();
    if (state.tab==="settings") renderSettings();
  };
});
/* 상단바 우측 아바타 버튼: 원본 앱에는 별도 "프로필" 화면이 없으므로 새 상태나
   로직을 만들지 않고, 이미 존재하는 [설정] 탭 버튼의 클릭을 그대로 위임한다. */
const topbarAvatarBtn = document.getElementById("topbar-avatar");
if (topbarAvatarBtn) topbarAvatarBtn.onclick = ()=> document.querySelector('.tab[data-tab="settings"]').click();

/* ==========================================================================================
   부팅 / 재계산
   ========================================================================================== */
function recomputeDay(){
  const clothKey = CLOTH_KEYS[state.settings.clothIdx];
  state.dayResult = computeDayResult(state.forecast, state.profile, clothKey, state.settings.spfOn, 0);
  state.tomorrowResult = computeDayResult(state.forecast, state.profile, clothKey, state.settings.spfOn, 1);
  if (state.dayResult){
    const modeLog = Store.getModeLog();
    modeLog[state.dayResult.dateStr] = state.dayResult.mode; // §4 결과를 로그에 저장 → 주간 화면의 정확한 연속일 계산에 사용
    Store.setModeLog(modeLog);
  }
}

async function boot(){
  document.getElementById("shell").classList.remove("hide");
  updateTopbarLoc();
  renderHome();
  const result = await fetchForecast(state.profile.lat, state.profile.lon);
  state.forecast = result.data;
  state.fetchInfo = result;
  if (result.userMessage && result.data) showToast(result.userMessage, 5000);
  else if (result.uvWarning) showToast(result.uvWarning, 4000);
  recomputeDay();
  if (state.tab==="home") renderHome();
  if (state.tab==="timer") renderTimer();
  if (state.tab==="week") renderWeek();
  if (state.tab==="settings") renderSettings();
}

function start(){
  renderSkinOptions();
  renderCityFallback();

  const seen = Store.getSeen();
  setTimeout(()=>{
    document.getElementById("splash").classList.add("hide");
    if (seen && state.profile){
      resumeTimerIfAny(); // 새로고침·재접속 시 실행 중이던 타이머를 실제 경과 시간 기준으로 복원
      boot();
    } else {
      document.getElementById("onboarding").classList.remove("hide");
    }
  }, 1200);
}
/* 접근성 보강: role="switch"/role="button"을 붙인 커스텀 토글(.switch)·칩(.chip)은
   원래 div/버튼이 아니므로 Enter·Space로도 클릭과 동일하게 동작하도록 위임 처리한다.
   기존 onclick 핸들러는 전혀 건드리지 않고, 같은 click 이벤트를 그대로 발생시킬 뿐이다. */
document.addEventListener("keydown", (e)=>{
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target;
  if (t && (t.classList.contains("switch") || t.classList.contains("chip")) && (t.getAttribute("role")==="switch" || t.getAttribute("role")==="button")){
    e.preventDefault();
    t.click();
  }
});

start();
</script>
</body>
